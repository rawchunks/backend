kind: ScaledObject
metadata:
  name: acestep-turbo-scaler
  namespace: rawchunks
spec:
  scaleTargetRef:
    name: acestep-xl-15-turbo
  minReplicaCount: 1
  maxReplicaCount: 8
  cooldownPeriod: 300
  pollingInterval: 5
  triggers:
    - type: redis
      metadata:
        connectionFromEnv: VALKEY_REQUESTS_SERVICE_URI
        listName: rawchunks:worker:turbo:pending
        listLength: "4"
---
