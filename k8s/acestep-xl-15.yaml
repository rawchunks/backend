apiVersion: apps/v1
kind: Deployment
metadata:
  name: acestep-xl-15-turbo
  namespace: rawchunks
  labels:
    app: acestep-xl-15-turbo
    tier: generation
spec:
  replicas: 1
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: acestep-xl-15-turbo
  template:
    metadata:
      labels:
        app: acestep-xl-15-turbo
        tier: generation
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-l4-warm
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoints
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      containers:
        - name: worker
          image: us-east1-docker.pkg.dev/gen-lang-client-0035632562/compose/acestep-xl-15@sha256:001fbf44014b7376f99510eddda2110501ad93c8cebaebda7ffe3f6d64537e53
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --no-sync
            - python
            - -m
            - acestep.api_server
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: acestep-secrets
                  key: HF_TOKEN
            - name: ACESTEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: acestep-secrets
                  key: ACESTEP_API_KEY
            - name: CHECKPOINTS_DIR
              value: /checkpoints
            - name: HF_HOME
              value: /checkpoints
            - name: ACESTEP_CHECKPOINTS_DIR
              value: /checkpoints
            - name: DEFAULT_DIT_MODEL
              value: acestep-v15-xl-turbo
            - name: DEFAULT_LM_MODEL
              value: acestep-5Hz-lm-0.6B
            - name: ACESTEP_CONFIG_PATH
              value: acestep-v15-xl-turbo
            - name: ACESTEP_NO_INIT
              value: "false"
            - name: HF_ENABLE_PARALLEL_LOADING
              value: "true"
            - name: ACESTEP_LM_MODEL_PATH
              value: acestep-5Hz-lm-0.6B
            - name: ACESTEP_LM_BACKEND
              value: vllm
            - name: ACESTEP_CONFIG_TURBO
              value: acestep-v15-xl-turbo
            - name: ACESTEP_OFFLOAD_TO_CPU
              value: "false"
            - name: ACESTEP_OFFLOAD_DIT_TO_CPU
              value: "false"
            - name: ACESTEP_LM_OFFLOAD_TO_CPU
              value: "false"
            - name: ACESTEP_SAVE_MEMORY
              value: "false"
            - name: ACESTEP_VAE_DECODE_CHUNK_SIZE
              value: "1536"
            - name: ACESTEP_MPS_DECODE_OFFLOAD
              value: "false"
            - name: ACESTEP_COMPILE_MODEL
              value: "true"
            - name: ACESTEP_LORA_HOT_CACHE
              value: "true"
            - name: ACESTEP_INIT_DEMUCS
              value: "false"
            - name: ACESTEP_ON_DEMAND_MODEL_LOAD
              value: "false"
            - name: ACESTEP_MAX_EXECUTORS
              value: "32"
            - name: ACESTEP_QUEUE_WORKERS
              value: "1"
            - name: ACESTEP_API_WORKERS
              value: "1"
            - name: ACESTEP_TMPDIR
              value: /dev/shm/acestep
            - name: VALKEY_REQUESTS_SERVICE_URI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: VALKEY_REQUESTS_SERVICE_URI
            - name: VALKEY_REQUESTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: VALKEY_REQUESTS_PASSWORD
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CF_ACCOUNT_ID
                  optional: true
            - name: CF_GLOBAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CF_GLOBAL_TOKEN
                  optional: true
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CF_API_TOKEN
                  optional: true
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: R2_BUCKET_NAME
                  optional: true
            - name: ACESTEP_ROLE
              value: generation
            - name: ACESTEP_QUEUE_NAMESPACE
              value: rawchunks:worker:turbo
            - name: ACESTEP_TRAINING_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ACESTEP_TRAINING_URL
          volumeMounts:
            - name: checkpoints
              mountPath: /checkpoints
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              nvidia.com/gpu: 1
              memory: 20Gi
              cpu: 4000m
            limits:
              nvidia.com/gpu: 1
              memory: 27Gi
              cpu: 7500m
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 120
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
