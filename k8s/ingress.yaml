apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: api
  namespace: rawchunks
spec:
  domains:
    - api.rawchunks.space
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: rawchunks
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "api"
spec:
  rules:
    - host: api.rawchunks.space
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 80

