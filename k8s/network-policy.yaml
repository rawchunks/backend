apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-ingress
  namespace: rawchunks
spec:
  podSelector:
    matchLabels:
      app: acestep-xl-15-turbo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8001

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: training-ingress
  namespace: rawchunks
spec:
  podSelector:
    matchLabels:
      app: acestep-training
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: acestep-xl-15-turbo
      ports:
        - protocol: TCP
          port: 8001
