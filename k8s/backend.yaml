apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rawchunks
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: us-east1-docker.pkg.dev/gen-lang-client-0035632562/compose/backend@sha256:d8b56eae08f8caf3c7846a4b386594f86b1377430109829a4f629a05a4e2e66c
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
              name: http
          env:
            - name: PORT
              value: "3005"
            - name: HOST
              value: 0.0.0.0
            - name: ACESTEP_API_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ACESTEP_API_URL
            - name: ACESTEP_TURBO_API_URL
              value: "http://acestep-service:8001"
            - name: ACESTEP_SFT_API_URL
              value: "http://acestep-sft-service:8001"
            - name: ACESTEP_BASE_API_URL
              value: "http://acestep-base-service:8001"
            - name: ACESTEP_TRAINING_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ACESTEP_TRAINING_URL
            - name: VOICE_PREPARATION_ENABLED
              value: "true"
            - name: SONG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: SONG_DATABASE_URL
            - name: USER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: USER_DATABASE_URL
            - name: ACESTEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ACESTEP_API_KEY
            - name: GOOGLE_GENERATIVE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GOOGLE_GENERATIVE_AI_API_KEY
            - name: NEBIUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: NEBIUS_API_KEY
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ELEVENLABS_API_KEY
            - name: CARTESIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CARTESIA_API_KEY
            - name: RAWCHUNKS_TREASURY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: RAWCHUNKS_TREASURY_ADDRESS
            - name: RAWCHUNKS_SOLANA_TREASURY_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: RAWCHUNKS_SOLANA_TREASURY_ADDRESS
            - name: COMPOSE_API_URL
              value: "https://api.compose.market"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: temporary
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 2
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 2Gi
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rawchunks
  labels:
    app: api
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3005
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: rawchunks
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
