apiVersion: v1
kind: PersistentVolume
metadata:
  name: checkpoints
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 200Gi
  storageClassName: premium-rwo
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: pd.csi.storage.gke.io
    fsType: ext4
    volumeHandle: projects/gen-lang-client-0035632562/zones/us-central1-b/disks/rawchunks-checkpoints-turbo-b
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.gke.io/zone
              operator: In
              values:
                - us-central1-b
---
apiVersion: v1
